# fly.toml app configuration file generated for micemore-gateway on 2026-05-06T00:25:17+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'micemore-gateway'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  DEPLOY_ENV = 'prod'
  LOG_LEVEL = 'INFO'
  PORT = '8080'
  USE_MOCK = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
